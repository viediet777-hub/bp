<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ShopEasy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#f5f6fa;--card:#fff;--accent:#7c5cfc;--accent2:#ff6b9d;--text:#1a1a2e;--text2:#666;--text3:#999;--border:#eee;--green:#2ecc71;--radius:14px;--shadow:0 2px 12px rgba(0,0,0,.06)}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;padding-bottom:70px}
a{text-decoration:none;color:inherit}img{display:block}
input,button{font-family:inherit;outline:none;border:none}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:12px 24px;border-radius:12px;font-size:13px;font-weight:600;z-index:9999;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.spinner{display:inline-block;width:20px;height:20px;border:2.5px solid rgba(124,92,252,.3);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
.fade-up{animation:fadeUp .4s ease forwards}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--card);position:sticky;top:0;z-index:100;box-shadow:0 1px 8px rgba(0,0,0,.04)}
.topbar h1{font-size:20px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.topbar-icons{display:flex;gap:14px;align-items:center}
.topbar-icons svg{width:22px;height:22px;cursor:pointer;color:var(--text)}
.search-bar{margin:12px 16px;position:relative}
.search-bar input{width:100%;padding:12px 16px 12px 44px;border-radius:12px;background:var(--card);border:1px solid var(--border);font-size:14px;box-shadow:var(--shadow)}
.search-bar input:focus{border-color:var(--accent)}
.search-bar svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--text3)}
.banner{margin:0 16px 12px;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.banner-inner{background:linear-gradient(135deg,var(--accent),var(--accent2));padding:20px 16px;min-height:120px;display:flex;flex-direction:column;justify-content:center}
.banner-inner h2{color:#fff;font-size:18px;font-weight:800;margin-bottom:4px}
.banner-inner p{color:rgba(255,255,255,.85);font-size:12px;margin-bottom:14px}
.banner-offer{background:rgba(255,255,255,.18);border-radius:10px;padding:10px 14px;margin-bottom:12px;color:#fff;font-size:13px;font-weight:600;backdrop-filter:blur(6px)}
.banner-btn{align-self:flex-start;background:#fff;color:var(--accent);padding:10px 22px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;transition:.2s}
.banner-btn:active{transform:scale(.95)}.banner-btn:disabled{opacity:.6;cursor:not-allowed}
.section-title{padding:16px 16px 10px;font-size:15px;font-weight:700}
.cat-row{display:flex;gap:14px;padding:0 16px 16px;overflow-x:auto;scrollbar-width:none}
.cat-row::-webkit-scrollbar{display:none}
.cat-item{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:68px;cursor:pointer}
.cat-item .ci{width:56px;height:56px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;font-size:26px;transition:.2s}
.cat-item .ci:active{transform:scale(.92)}
.cat-item span{font-size:11px;font-weight:600;color:var(--text2);white-space:nowrap}
.prod-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 12px 20px}
.prod-card{background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:.2s}
.prod-card:active{transform:scale(.97)}
.prod-card img{width:100%;aspect-ratio:1;object-fit:cover;background:#f0f0f0}
.prod-card .info{padding:10px 12px}
.prod-card .info h3{font-size:12px;font-weight:600;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:34px}
.prod-card .info .price{margin-top:6px;font-size:15px;font-weight:800;color:var(--accent)}
.prod-card .info .price span{font-size:11px;font-weight:500;color:var(--text3);text-decoration:line-through;margin-left:6px}
.prod-card .info .src{font-size:10px;color:var(--text3);margin-top:4px;text-transform:capitalize}
.prod-card .info .fod{font-size:10px;color:var(--accent2);font-weight:700;margin-top:2px}
.cart-item{display:flex;gap:12px;background:var(--card);margin:0 12px 10px;padding:12px;border-radius:var(--radius);box-shadow:var(--shadow);animation:fadeUp .3s ease}
.cart-item img{width:72px;height:72px;border-radius:10px;object-fit:cover;background:#f0f0f0}
.cart-item .cd{flex:1;display:flex;flex-direction:column;justify-content:space-between}
.cart-item .cd h4{font-size:13px;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cart-item .cd .cp{font-size:14px;font-weight:700;color:var(--accent)}
.qty-ctrl{display:flex;align-items:center;background:var(--bg);border-radius:10px;overflow:hidden;width:fit-content}
.qty-ctrl button{width:30px;height:30px;display:flex;align-items:center;justify-content:center;background:transparent;font-size:16px;font-weight:700;color:var(--accent);cursor:pointer}
.qty-ctrl span{width:32px;text-align:center;font-size:13px;font-weight:700}
.order-card{background:var(--card);margin:0 12px 10px;padding:14px;border-radius:var(--radius);box-shadow:var(--shadow)}
.order-card .oh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.order-card .oh h4{font-size:13px;font-weight:700}
.badge{padding:4px 10px;border-radius:8px;font-size:10px;font-weight:700;text-transform:uppercase}
.badge.pending{background:#fff3e0;color:#e67e22}
.badge.placed{background:#f3e5f5;color:#8e24aa}
.badge.confirmed{background:#e8f5e9;color:#27ae60}
.badge.shipped{background:#e3f2fd;color:#2980b9}
.badge.delivered{background:#e8f5e9;color:#1b8a4a}
.badge.cancelled{background:#fdecea;color:#c0392b}
.order-card .oi{font-size:12px;color:var(--text2);margin-bottom:4px}
.order-card .ot{font-size:14px;font-weight:700;color:var(--accent)}
.timeline{display:flex;align-items:center;justify-content:space-between;margin:12px 0 4px;padding:0 8px}
.timeline .step{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1}
.timeline .step .dot{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;background:var(--bg);border:2px solid var(--border);transition:.3s}
.timeline .step.done .dot{background:var(--green);border-color:var(--green);color:#fff}
.timeline .step.active .dot{background:var(--accent);border-color:var(--accent);color:#fff;animation:pop .5s ease}
.timeline .step .lbl{font-size:9px;font-weight:600;color:var(--text3);text-align:center}
.timeline .step.done .lbl,.timeline .step.active .lbl{color:var(--text)}
.timeline .line{flex:1;height:2px;background:var(--border);margin:0 -4px;margin-bottom:18px}
.timeline .line.done{background:var(--green)}
.profile-card{margin:12px 16px;background:linear-gradient(135deg,var(--accent),var(--accent2));padding:20px;border-radius:var(--radius);color:#fff}
.profile-card h3{font-size:18px;font-weight:800}
.profile-card p{font-size:12px;opacity:.8;margin-top:4px}
.wallet-card{margin:0 16px 12px;background:var(--card);padding:16px;border-radius:var(--radius);box-shadow:var(--shadow)}
.wallet-card .wl{display:flex;justify-content:space-between;align-items:center}
.wallet-card .wl h4{font-size:13px;font-weight:600;color:var(--text2)}
.wallet-card .wl .wbal{font-size:22px;font-weight:800;color:var(--accent)}
.menu-item{display:flex;align-items:center;gap:14px;padding:14px 16px;margin:0 12px;background:var(--card);border-radius:12px;box-shadow:var(--shadow);cursor:pointer;margin-bottom:8px;transition:.15s}
.menu-item:active{transform:scale(.98);background:#f0eefc}
.menu-item svg{width:20px;height:20px;color:var(--accent)}
.menu-item span{flex:1;font-size:14px;font-weight:600}
.menu-item .arrow{color:var(--text3);font-size:16px}
.tab-bar{position:fixed;bottom:0;left:0;right:0;background:var(--card);display:flex;justify-content:space-around;padding:8px 0 env(safe-area-inset-bottom,8px);box-shadow:0 -2px 16px rgba(0,0,0,.06);z-index:100}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:4px 12px;position:relative;transition:.15s}
.tab svg{width:22px;height:22px;color:var(--text3);transition:.15s}
.tab span{font-size:10px;font-weight:600;color:var(--text3);transition:.15s}
.tab.active svg{color:var(--accent)}.tab.active span{color:var(--accent)}
.tab .badge-num{position:absolute;top:-2px;right:2px;background:var(--accent2);color:#fff;font-size:9px;font-weight:700;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.page{display:none;animation:fadeUp .35s ease}.page.active{display:block}
.bottom-bar{position:fixed;bottom:60px;left:0;right:0;background:var(--card);padding:12px 16px;box-shadow:0 -2px 16px rgba(0,0,0,.06);display:flex;justify-content:space-between;align-items:center;z-index:99}
.bottom-bar .total-label{font-size:14px;font-weight:600;color:var(--text2)}
.bottom-bar .total-val{font-size:20px;font-weight:800;color:var(--accent)}
.bottom-bar button{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;padding:12px 28px;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;transition:.2s}
.bottom-bar button:active{transform:scale(.95)}
.empty{text-align:center;padding:60px 20px;color:var(--text3)}
.empty svg{width:64px;height:64px;margin:0 auto 16px;opacity:.3}
.empty p{font-size:14px;font-weight:600}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
.modal-overlay.show{display:flex}
.modal{background:var(--card);border-radius:20px 20px 0 0;padding:24px 20px 32px;width:100%;max-width:500px;animation:fadeUp .3s ease;max-height:85vh;overflow-y:auto;position:relative}
.modal h2{font-size:18px;font-weight:800;margin-bottom:6px}
.modal p{font-size:13px;color:var(--text2);margin-bottom:18px}
.modal input{width:100%;padding:14px 16px;border-radius:12px;background:var(--bg);border:1px solid var(--border);font-size:15px;margin-bottom:12px}
.modal input:focus{border-color:var(--accent)}
.modal button{width:100%;padding:14px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:15px;font-weight:700;cursor:pointer;transition:.2s;margin-bottom:8px}
.modal button:active{transform:scale(.97)}.modal button:disabled{opacity:.5;cursor:not-allowed}
.modal .cancel-btn{background:transparent;color:var(--text3);font-size:13px;font-weight:600;margin-top:4px}
.accounts-list{margin:0 12px}
.acc-card{background:var(--card);padding:14px;border-radius:12px;box-shadow:var(--shadow);margin-bottom:10px}
.acc-card h4{font-size:14px;font-weight:700;margin-bottom:4px}
.acc-card p{font-size:12px;color:var(--text2)}
.acc-card .status{display:inline-block;padding:3px 8px;border-radius:6px;font-size:10px;font-weight:700;margin-top:6px}
.acc-card .status.active{background:#e8f5e9;color:#27ae60}
.acc-card .status.inactive{background:#fdecea;color:#c0392b}
.pmodal-img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;background:#f0f0f0;margin-bottom:16px}
.pmodal-name{font-size:18px;font-weight:800;margin-bottom:6px}
.pmodal-price{font-size:22px;font-weight:800;color:var(--accent);margin-bottom:2px}
.pmodal-mrp{font-size:14px;color:var(--text3);text-decoration:line-through;margin-bottom:4px}
.pmodal-fod{font-size:13px;color:var(--accent2);font-weight:700;margin-bottom:12px}
.pmodal-desc{font-size:13px;color:var(--text2);line-height:1.5;margin-bottom:16px}
.pmodal-sizes{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.size-chip{padding:8px 16px;border-radius:10px;background:var(--bg);border:2px solid var(--border);font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
.size-chip.selected{border-color:var(--accent);background:#f0eefc;color:var(--accent)}
.close-modal{position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.06);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;color:var(--text2);z-index:5}
</style>
</head>
<body>
<div class="toast" id="toast"></div>

<div class="page active" id="page-home">
  <div class="topbar"><h1>ShopEasy</h1>
    <div class="topbar-icons" onclick="openLogin()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </div>
  </div>
  <div class="search-bar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
    <input type="text" placeholder="Search products..." id="homeSearch" onkeyup="debounceHomeSearch()">
  </div>
  <div id="bannerArea"></div>
  <div class="section-title">Categories</div>
  <div class="cat-row" id="catRow"></div>
  <div class="section-title">For You</div>
  <div class="prod-grid" id="homeProdGrid"></div>
</div>

<div class="page" id="page-explore">
  <div class="topbar"><h1>Explore</h1></div>
  <div class="search-bar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
    <input type="text" placeholder="Search products..." id="exploreSearch" onkeyup="debounceExploreSearch()">
  </div>
  <div id="exploreCatRow" class="cat-row" style="padding-top:4px"></div>
  <div class="prod-grid" id="exploreProdGrid"></div>
  <div id="exploreLoader" style="text-align:center;padding:20px;display:none"><div class="spinner"></div></div>
</div>

<div class="page" id="page-cart">
  <div class="topbar"><h1>Cart</h1></div>
  <div id="cartList"></div>
  <div class="bottom-bar" id="cartBottom" style="display:none">
    <div><div class="total-label">Total</div><div class="total-val" id="cartTotal">Rs.0</div></div>
    <button onclick="placeOrder()">Place Order</button>
  </div>
</div>

<div class="page" id="page-orders">
  <div class="topbar"><h1>Orders</h1></div>
  <div id="orderList"></div>
</div>

<div class="page" id="page-account">
  <div class="topbar"><h1>Account</h1></div>
  <div class="profile-card"><h3 id="userName">Guest User</h3><p id="userPhone">Tap to login</p></div>
  <div class="wallet-card"><div class="wl"><h4>Wallet Balance</h4><div class="wbal" id="walletBal">Rs.0</div></div></div>
  <div class="section-title">Meesho Accounts</div>
  <div class="accounts-list" id="accountsList"></div>
  <div style="height:8px"></div>
  <div class="menu-item" onclick="switchTab(3)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 14l2 2 4-4"/></svg>
    <span>My Orders</span><span class="arrow">&#8250;</span>
  </div>
  <div class="menu-item" onclick="exportData()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    <span>Export Data</span><span class="arrow">&#8250;</span>
  </div>
  <div class="menu-item" onclick="refreshSession()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>
    <span>Refresh Session</span><span class="arrow">&#8250;</span>
  </div>
  <div style="height:20px"></div>
</div>

<div class="modal-overlay" id="loginModal">
  <div class="modal">
    <h2 id="loginTitle">Login</h2>
    <p id="loginSub">Enter your phone number to continue</p>
    <input type="tel" id="loginPhone" placeholder="Phone number" maxlength="10">
    <div id="refWrap" style="margin-top:0;margin-bottom:12px">
      <input type="text" id="loginRef" placeholder="Referral link (optional)" style="width:100%;padding:14px 16px;border-radius:12px;background:var(--bg);border:1px solid var(--border);font-size:13px">
      <p style="font-size:11px;color:var(--text3);margin-top:4px">Leave blank to use default referral</p>
    </div>
    <div id="otpWrap" style="display:none"><input type="tel" id="loginOtp" placeholder="Enter OTP" maxlength="6"></div>
    <button id="loginBtn" onclick="handleLogin()">Send OTP</button>
    <button class="cancel-btn" onclick="closeLogin()">Cancel</button>
  </div>
</div>

<div class="modal-overlay" id="productModal">
  <div class="modal">
    <div class="close-modal" onclick="closeProductModal()">&#10005;</div>
    <div id="productModalContent"></div>
  </div>
</div>

<nav class="tab-bar">
  <div class="tab active" onclick="switchTab(0)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg><span>Home</span>
  </div>
  <div class="tab" onclick="switchTab(1)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg><span>Explore</span>
  </div>
  <div class="tab" onclick="switchTab(2)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/></svg><span>Cart</span>
    <div class="badge-num" id="cartBadge" style="display:none">0</div>
  </div>
  <div class="tab" onclick="switchTab(3)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg><span>Orders</span>
  </div>
  <div class="tab" onclick="switchTab(4)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>Account</span>
  </div>
</nav>

<script>
var API='';
var userId=localStorage.getItem('userId')||('u'+Math.random().toString(36).slice(2,10));
localStorage.setItem('userId',userId);
var cartCount=0,currentTab=0,exploreOffset=0,exploreQuery='',exploreLoading=false,exploreDone=false;
var loginStep=1,loginPhone='';
const DEFAULT_REF='https://app.meesho.com/2yoV/r99th0qd?via=8ghwzu&from=account_section';

function headers(){return{'Content-Type':'application/json','X-User-Id':userId}}
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2200)}
function showEl(id,v){document.getElementById(id).style.display=v?'block':'none'}
function $(id){return document.getElementById(id)}

function switchTab(i){
  if(i===currentTab)return;
  currentTab=i;
  document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active')});
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});
  var pages=['home','explore','cart','orders','account'];
  $('page-'+pages[i]).classList.add('active');
  document.querySelectorAll('.tab')[i].classList.add('active');
  if(i===2)loadCart();
  if(i===3)loadOrders();
  if(i===4)loadAccount();
  window.scrollTo(0,0);
}

var catEmojis=['\uD83D\uDC57','\uD83D\uDC5F','\uD83D\uDCF1','\uD83D\uDCBB','\uD83C\uDFE0','\u231A','\uD83C\uDFAE','\uD83D\uDC84'];
var catNames=['Fashion','Shoes','Mobile','Laptop','Home','Watch','Gaming','Beauty'];

function loadCategories(containerId){
  var c=$(containerId);
  c.innerHTML=catNames.map(function(name,i){return '<div class="cat-item" onclick="searchCat(\''+name+'\')"><div class="ci">'+catEmojis[i]+'</div><span>'+name+'</span></div>'}).join('');
}

function searchCat(name){
  if(currentTab!==1)switchTab(1);
  $('exploreSearch').value=name;
  exploreQuery=name;exploreOffset=0;exploreDone=false;
  searchProducts();
}

function renderProductCard(p){
  var pid=p.product_id||p.id||'';
  var img=p.image_url||p.image||p.thumbnail||'';
  var name=p.name||p.title||'Product';
  var price=p.price||0;
  var orig=p.original_price||p.mrp||'';
  var fod=p.fod_price||'';
  var src=p.source||'meesho';
  var rating=p.rating||'';
  var origHtml=orig?'<span>Rs.'+orig+'</span>':'';
  var fodHtml=fod?'<div class="fod">FOD: Rs.'+fod+'</div>':'';
  var ratingHtml=rating?'<div class="src">'+rating+'</div>':'';
  return '<div class="prod-card fade-up" onclick="openProduct(\''+pid+'\')"><img src="'+img+'" alt="" loading="lazy"><div class="info"><h3>'+name+'</h3><div class="price">Rs.'+price+origHtml+'</div>'+fodHtml+'<div class="src">'+src+'</div>'+ratingHtml+'</div></div>';
}

function renderProducts(prods,gridId){
  $(gridId).innerHTML=prods.map(function(p){return renderProductCard(p)}).join('');
}

function renderProductsAppend(prods){
  var g=$('exploreProdGrid');
  prods.forEach(function(p){g.insertAdjacentHTML('beforeend',renderProductCard(p))});
}

async function openProduct(pid){
  if(!pid)return;
  try{
    var r=await fetch(API+'/api/product?product_id='+encodeURIComponent(pid),{headers:headers()});
    var d=await r.json();
    var name=d.name||'Product';
    var price=d.price||0;
    var mrp=d.mrp||d.original_price||'';
    var img=(d.images&&d.images[0])||d.image||'';
    var desc=d.description||d.about||'';
    var sizes=d.sizes||d.size_options||[];
    var fod=d.fod_price||d.discount_text||'';
    var sizesHtml='';
    if(sizes.length){
      sizesHtml='<div class="pmodal-sizes">'+sizes.map(function(s,i){return '<div class="size-chip'+(i===0?' selected':'')+'" onclick="selectSize(this)">'+(typeof s==='string'?s:s.size||s.name||'')+'</div>'}).join('')+'</div>';
    }
    var mrpHtml=mrp?'<div class="pmodal-mrp">Rs.'+mrp+'</div>':'';
    var fodHtml=fod?'<div class="pmodal-fod">'+fod+'</div>':'';
    var descHtml=desc?'<div class="pmodal-desc">'+desc+'</div>':'';
    var safeName=name.replace(/'/g,"\\'");
    $('productModalContent').innerHTML='<img class="pmodal-img" src="'+img+'" alt=""><div class="pmodal-name">'+name+'</div><div class="pmodal-price">Rs.'+price+'</div>'+mrpHtml+fodHtml+descHtml+sizesHtml+'<button onclick="addToCartFromModal(\''+pid+'\',\''+safeName+'\',\''+price+'\',\''+img+'\')">Add to Cart</button>';
    $('productModal').classList.add('show');
  }catch(e){toast('Failed to load product')}
}

function closeProductModal(){$('productModal').classList.remove('show')}
function selectSize(el){el.parentElement.querySelectorAll('.size-chip').forEach(function(c){c.classList.remove('selected')});el.classList.add('selected')}

async function addToCartFromModal(pid,name,price,img){
  try{
    var r=await fetch(API+'/api/cart/add',{method:'POST',headers:headers(),body:JSON.stringify({product_id:pid,name:name,price:parseFloat(price),image:img,source:'meesho',qty:1})});
    var d=await r.json();
    if(d.ok){toast('Added to cart!');closeProductModal();loadCart()}
    else toast('Failed to add');
  }catch(e){toast('Failed to add to cart')}
}

async function loadHome(){loadBanner();loadProducts('homeProdGrid')}

async function loadBanner(){
  try{
    var r=await fetch(API+'/api/offers',{headers:headers()});
    var d=await r.json();
    var o=d.offer;
    if(o){
      $('bannerArea').innerHTML='<div class="banner"><div class="banner-inner"><h2>'+o.title+'</h2><p>'+o.subtitle+'</p><div class="banner-offer">'+o.text+'</div><button class="banner-btn" onclick="rollOffer()">Roll My Offer</button></div></div>';
    }else{
      $('bannerArea').innerHTML='<div class="banner"><div class="banner-inner"><h2>Today\'s Special Deal</h2><p>Roll to unlock an exclusive discount!</p><button class="banner-btn" onclick="rollOffer()">Roll My Offer</button></div></div>';
    }
  }catch(e){
    $('bannerArea').innerHTML='<div class="banner"><div class="banner-inner"><h2>Today\'s Special Deal</h2><p>Roll to unlock an exclusive discount!</p><button class="banner-btn" onclick="rollOffer()">Roll My Offer</button></div></div>';
  }
}

async function rollOffer(){
  try{
    var btn=document.querySelector('.banner-btn');
    if(btn){btn.disabled=true;btn.textContent='Rolling...'}
    var r=await fetch(API+'/api/offers/roll',{method:'POST',headers:headers()});
    var d=await r.json();
    if(d.ok&&d.offer){
      var o=d.offer;
      $('bannerArea').innerHTML='<div class="banner"><div class="banner-inner" style="animation:pop .4s ease"><h2>'+o.title+'</h2><p>'+o.subtitle+'</p><div class="banner-offer">'+o.text+'</div><button class="banner-btn" onclick="rollOffer()">Roll Again</button></div></div>';
      toast('Offer rolled!');
    }else{
      toast('No offer available');
      if(btn){btn.disabled=false;btn.textContent='Roll My Offer'}
    }
  }catch(e){toast('Failed to roll offer')}
}

async function loadProducts(gridId){
  try{
    var r=await fetch(API+'/api/products',{headers:headers()});
    var prods=await r.json();
    renderProducts(Array.isArray(prods)?prods:[],gridId);
  }catch(e){}
}

var homeTimer,exploreTimer;
function debounceHomeSearch(){clearTimeout(homeTimer);homeTimer=setTimeout(function(){var q=$('homeSearch').value.trim();if(q.length>=2)searchHome(q);else loadProducts('homeProdGrid')},400)}
function debounceExploreSearch(){clearTimeout(exploreTimer);exploreTimer=setTimeout(function(){exploreQuery=$('exploreSearch').value.trim();exploreOffset=0;exploreDone=false;if(exploreQuery.length>=2)searchProducts();else loadProducts('exploreProdGrid')},400)}

async function searchHome(q){
  try{
    var r=await fetch(API+'/api/search',{method:'POST',headers:headers(),body:JSON.stringify({query:q,limit:20,offset:0})});
    var d=await r.json();
    renderProducts(d.catalogs||[],'homeProdGrid');
  }catch(e){}
}

async function searchProducts(){
  if(exploreLoading||exploreDone)return;
  exploreLoading=true;showEl('exploreLoader',true);
  try{
    var r=await fetch(API+'/api/search',{method:'POST',headers:headers(),body:JSON.stringify({query:exploreQuery,limit:20,offset:exploreOffset})});
    var d=await r.json();
    var prods=d.catalogs||[];
    if(prods.length<20)exploreDone=true;
    if(exploreOffset===0){$('exploreProdGrid').innerHTML=''}
    renderProductsAppend(prods);
    exploreOffset+=prods.length;
  }catch(e){}
  exploreLoading=false;showEl('exploreLoader',false);
}

window.addEventListener('scroll',function(){
  if(currentTab!==1)return;
  if((window.innerHeight+window.scrollY)>=document.body.offsetHeight-300){searchProducts()}
});

async function loadCart(){
  try{
    var r=await fetch(API+'/api/cart',{headers:headers()});
    var items=await r.json();
    renderCart(Array.isArray(items)?items:[]);
  }catch(e){$('cartList').innerHTML='<div class="empty"><p>Failed to load cart</p></div>'}
}

function renderCart(items){
  if(!items.length){
    $('cartList').innerHTML='<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/></svg><p>Your cart is empty</p></div>';
    showEl('cartBottom',false);updateCartBadge(0);return;
  }
  var total=0;
  $('cartList').innerHTML=items.map(function(c){
    var sub=(c.price||0)*(c.qty||1);total+=sub;
    var cid=c.id||c.cart_id||c._id||'';
    return '<div class="cart-item fade-up"><img src="'+c.image+'" alt=""><div class="cd"><h4>'+c.name+'</h4><div class="cp">Rs.'+sub+'</div><div class="qty-ctrl"><button onclick="updateQty(\''+cid+'\','+((c.qty||1)-1)+')">-</button><span>'+(c.qty||1)+'</span><button onclick="updateQty(\''+cid+'\','+((c.qty||1)+1)+')">+</button></div></div></div>';
  }).join('');
  $('cartTotal').textContent='Rs.'+total;
  showEl('cartBottom',true);cartCount=items.length;updateCartBadge(items.length);
}

async function updateQty(cid,qty){
  if(qty<1)qty=0;
  try{await fetch(API+'/api/cart/update',{method:'POST',headers:headers(),body:JSON.stringify({cart_id:cid,qty:qty})});loadCart()}
  catch(e){toast('Failed to update')}
}

function updateCartBadge(n){$('cartBadge').textContent=n;$('cartBadge').style.display=n>0?'flex':'none'}

async function placeOrder(){
  try{
    var r=await fetch(API+'/api/orders/place',{method:'POST',headers:headers()});
    var d=await r.json();
    if(d.ok){toast('Order placed! #'+d.order_id);loadCart();switchTab(3)}
    else toast(d.error||'Failed to place order');
  }catch(e){toast('Failed to place order')}
}

async function loadOrders(){
  try{
    var r=await fetch(API+'/api/orders',{headers:headers()});
    var orders=await r.json();
    var list=Array.isArray(orders)?orders:[];
    if(!list.length){$('orderList').innerHTML='<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg><p>No orders yet</p></div>';return}
    $('orderList').innerHTML=list.map(function(o){
      var oid=o.id||o.order_id||'';
      var status=(o.status||'pending').toLowerCase();
      var items=o.items||[];
      var date=o.created_at||'';
      var total=o.total||0;
      var steps=['pending','confirmed','shipped','delivered'];
      var stepLabels=['Pending','Confirmed','Shipped','Delivered'];
      var stepIcons=['&#9203;','&#128230;','&#128666;','&#9989;'];
      var currentIdx=steps.indexOf(status);if(currentIdx===-1)currentIdx=0;
      var timelineHtml=steps.map(function(s,i){
        var cls=i<currentIdx?'done':i===currentIdx?'active':'';
        var lineCls=i<currentIdx?'done':'';
        var isLast=i===steps.length-1;
        return '<div class="step '+cls+'"><div class="dot">'+stepIcons[i]+'</div><div class="lbl">'+stepLabels[i]+'</div></div>'+(isLast?'':'<div class="line '+lineCls+'"></div>');
      }).join('');
      return '<div class="order-card fade-up"><div class="oh"><h4>Order #'+String(oid).slice(-8)+'</h4><span class="badge '+status+'">'+status+'</span></div><div class="oi">'+items.length+' item(s) | '+date+'</div><div class="ot">Rs.'+total+'</div><div class="timeline">'+timelineHtml+'</div></div>';
    }).join('');
  }catch(e){$('orderList').innerHTML='<div class="empty"><p>Failed to load orders</p></div>'}
}

async function loadAccount(){
  try{
    var r=await fetch(API+'/api/user',{headers:headers()});
    var d=await r.json();
    $('userName').textContent=d.name||d.phone||'User';
    $('userPhone').textContent=d.phone?'Phone: '+d.phone:'Tap to login';
    if(d.referral_link){
      var refShort=d.referral_link.length>40?d.referral_link.substring(0,40)+'...':d.referral_link;
      $('userPhone').innerHTML+=(d.phone?'<br>':'')+'<span style="font-size:11px;color:rgba(255,255,255,.7);word-break:break-all">Ref: '+refShort+'</span>';
    }
  }catch(e){}
  try{
    var r=await fetch(API+'/api/wallet',{headers:headers()});
    var d=await r.json();
    $('walletBal').textContent='Rs.'+(d.balance||0);
  }catch(e){}
  try{
    var r=await fetch(API+'/api/accounts',{headers:headers()});
    var accs=await r.json();
    var list=Array.isArray(accs)?accs:[];
    if(!list.length){$('accountsList').innerHTML='<div style="text-align:center;padding:16px;color:var(--text3);font-size:13px">No accounts linked</div>';return}
    $('accountsList').innerHTML=list.map(function(a){
      var statusCls=a.meesho_user_id?'active':'inactive';
      var statusText=a.meesho_user_id?'Active':'Inactive';
      return '<div class="acc-card fade-up"><h4>'+a.phone+'</h4><p>ID: '+a.id+'</p><div class="status '+statusCls+'">'+statusText+'</div></div>';
    }).join('');
  }catch(e){}
}

async function exportData(){
  toast('Exporting data...');
  try{
    var r=await fetch(API+'/api/user/export',{headers:headers()});
    var d=await r.json();
    var blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='shop_easy_export.json';a.click();
    toast('Exported!');
  }catch(e){toast('Export failed')}
}

async function refreshSession(){
  toast('Refreshing session...');
  try{
    var r=await fetch(API+'/api/accounts/refresh',{method:'POST',headers:headers()});
    var d=await r.json();
    if(d.ok)toast('Session refreshed!');
    loadAccount();
  }catch(e){toast('Refresh failed')}
}

function openLogin(){$('loginModal').classList.add('show')}
function closeLogin(){$('loginModal').classList.remove('show');loginStep=1;$('otpWrap').style.display='none';$('refWrap').style.display='block';$('loginBtn').textContent='Send OTP';$('loginTitle').textContent='Login';$('loginSub').textContent='Enter your phone number to continue';$('loginRef').value='';$('loginPhone').value='';$('loginOtp').value='';}

async function handleLogin(){
  if(loginStep===1){
    loginPhone=$('loginPhone').value.trim();
    if(!loginPhone||loginPhone.length<10){toast('Enter valid phone number');return}
    $('loginBtn').disabled=true;$('loginBtn').textContent='Sending...';
    try{
      await fetch(API+'/api/auth/otp_send',{method:'POST',headers:headers(),body:JSON.stringify({phone_number:loginPhone})});
      loginStep=2;$('otpWrap').style.display='block';$('refWrap').style.display='none';$('loginBtn').textContent='Verify OTP';$('loginTitle').textContent='Verify OTP';$('loginSub').textContent='Enter the OTP sent to '+loginPhone;
      toast('OTP sent!');
    }catch(e){toast('Failed to send OTP')}
    $('loginBtn').disabled=false;
  }else{
    var otp=$('loginOtp').value.trim();
    if(!otp||otp.length<4){toast('Enter valid OTP');return}
    $('loginBtn').disabled=true;$('loginBtn').textContent='Verifying...';
    try{
      var r=await fetch(API+'/api/auth/otp_verify',{method:'POST',headers:headers(),body:JSON.stringify({phone_number:loginPhone,otp:otp})});
      var d=await r.json();
      if(d.ok){
        var refLink=$('loginRef').value.trim()||DEFAULT_REF;
        await fetch(API+'/api/user',{method:'POST',headers:headers(),body:JSON.stringify({phone:loginPhone,referral_link:refLink})});
        toast('Logged in!');closeLogin();loadAccount();
      } else toast('Invalid OTP');
    }catch(e){toast('Invalid OTP')}
    $('loginBtn').disabled=false;$('loginBtn').textContent='Verify OTP';
  }
}

loadHome();loadCategories('catRow');loadCategories('exploreCatRow');
</script>
