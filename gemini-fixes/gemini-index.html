<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>FOD Pilot — VIEDDETX SINGH</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg0:#0B0C10; --bg1:#141a26;
  --glass:rgba(255,255,255,.05); --glass2:rgba(255,255,255,.08);
  --line:rgba(102,252,241,.15); --line2:rgba(255,255,255,.09);
  --cyan:#66FCF1; --teal:#45A29E; --pink:#C9338A; --gold:#FFC94D;
  --txt:#EDF2F7; --txt2:#9AA7B8; --txt3:#5C6B80;
  --green:#3DDC97; --red:#FF5C7A; --r:18px;
}
body{
  font-family:'Inter',sans-serif;color:var(--txt);max-width:480px;margin:0 auto;
  min-height:100vh;padding-bottom:90px;
  background:radial-gradient(circle at top, #1a233a 0%, var(--bg0) 100%);
  background-attachment:fixed;
}
.num{font-family:'Space Grotesk',sans-serif}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:12px 14px;background:rgba(11,12,16,.85);backdrop-filter:blur(15px);border-bottom:1px solid var(--line2)}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px}
.logo-mark{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--cyan),var(--teal));color:#000;font-weight:900}
.cartbtn{margin-left:auto;position:relative;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--glass);border:1px solid var(--line2);cursor:pointer}
.cartbtn .bdg{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:99px;background:var(--pink);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center}
.view{display:none;padding:14px}
.view.active{display:block}
.glass{background:var(--glass);border:1px solid var(--line2);border-radius:var(--r);backdrop-filter:blur(16px)}
.sec{font-size:11px;font-weight:800;letter-spacing:1px;color:var(--txt2);margin:16px 2px 8px;display:flex;align-items:center;gap:8px}
.sec::after{content:"";flex:1;height:1px;background:var(--line2)}
.btn{width:100%;padding:14px;border-radius:14px;font-weight:800;font-size:14px;cursor:pointer;border:none;transition:0.2s}
.btn--go{background:linear-gradient(135deg,var(--cyan),var(--teal));color:#052723}
.btn--pink{background:linear-gradient(135deg,var(--pink),#8f2b6e);color:#fff}
.btn--ghost{background:var(--glass2);border:1px solid var(--line2);color:var(--txt)}
.hero{padding:20px 16px;border-radius:20px;background:linear-gradient(135deg,rgba(102,252,241,.1),rgba(201,51,138,.1)),var(--glass);border:1px solid var(--line)}
.hero-amt{font-size:38px;font-weight:700;color:var(--cyan);margin:6px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.pcard{border-radius:16px;overflow:hidden;background:var(--glass);border:1px solid var(--line2);cursor:pointer}
.pcard-img{aspect-ratio:1;background:#161d2b}
.pcard-img img{width:100%;height:100%;object-fit:cover}
.pcard-body{padding:8px 10px 10px}
.pcard-name{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.citem{display:flex;gap:10px;padding:10px;border-radius:16px;align-items:center;margin-top:8px}
.citem img{width:60px;height:60px;border-radius:10px;object-fit:cover;background:#161d2b}
.cart-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.btn-del{width:28px;height:28px;border-radius:99px;background:rgba(255,92,122,.15);border:1px solid var(--red);color:var(--red);cursor:pointer}
.btn-inc{width:28px;height:28px;border-radius:99px;background:rgba(102,252,241,.15);border:1px solid var(--cyan);color:var(--cyan);cursor:pointer}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;background:rgba(11,12,16,.9);backdrop-filter:blur(20px);border-top:1px solid var(--line2);z-index:40}
.nav button{flex:1;padding:12px 0;color:var(--txt3);border:none;background:none;font-weight:800;font-size:10px;cursor:pointer}
.nav button.on{color:var(--cyan)}
.sheetwrap,.qrwrap{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:50;display:none;backdrop-filter:blur(4px)}
.sheetwrap.show,.qrwrap.show{display:block}
.sheet{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#161d2b;border-radius:20px 20px 0 0;padding:16px;max-height:85vh;overflow-y:auto}
.qrcard{width:90%;max-width:320px;background:#161d2b;border:1px solid var(--line);border-radius:20px;padding:20px;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.fld{width:100%;padding:12px;background:rgba(255,255,255,.05);border:1px solid var(--line2);border-radius:12px;color:var(--txt);margin-top:8px}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#1f293d;padding:10px 18px;border-radius:99px;border:1px solid var(--line);font-size:12px;font-weight:700;z-index:99;opacity:0;transition:0.3s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="toast" id="toast"></div>

<header class="topbar">
  <div class="logo"><div class="logo-mark">⚡</div><div>VIEDDETX SINGH</div></div>
  <div class="cartbtn" onclick="go('cart')">🛒<span class="bdg num" id="cartBadge">0</span></div>
</header>

<!-- HOME -->
<section id="view-home" class="view active">
  <div class="hero">
    <div style="font-size:10px;font-weight:800;color:var(--cyan);letter-spacing:1px">EXCLUSIVE OFFER</div>
    <div class="hero-amt num" id="fodAmt">Upto ₹180 OFF</div>
    <div style="font-size:12px;color:var(--txt2)" id="fodSub">Auto-applied on your first checkout</div>
    <div style="margin-top:14px;display:flex;gap:10px">
      <button class="btn btn--go" onclick="rollOffer()">🎲 Roll Offer</button>
      <button class="btn btn--ghost" onclick="go('search')">Shop Now →</button>
    </div>
  </div>
  <div class="sec">TRENDING CATALOGS</div>
  <div class="grid" id="homeGrid"></div>
</section>

<!-- SEARCH -->
<section id="view-search" class="view">
  <div style="display:flex;gap:8px">
    <input id="q" class="fld" style="margin-top:0" placeholder="Search products..." onkeydown="if(event.key==='Enter')doSearch()">
    <button class="btn btn--go" style="width:70px" onclick="doSearch()">Go</button>
  </div>
  <div class="grid" id="searchGrid"></div>
</section>

<!-- CART -->
<section id="view-cart" class="view">
  <div class="glass" style="padding:12px;cursor:pointer" onclick="openAddressSheet()">
    <div style="font-size:10px;font-weight:800;color:var(--cyan)">DELIVER TO</div>
    <div id="cartAddr" style="font-size:13px;font-weight:700;margin-top:2px">Select delivery address</div>
  </div>
  <div id="cartList"></div>
  <div class="glass" id="cartSummary" style="padding:14px;margin-top:14px;display:none">
    <div style="display:flex;justify-content:space-between;font-size:13px"><span>Price</span><span class="num" id="sMrp">₹0</span></div>
    <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--green);margin-top:4px"><span>Discount</span><span class="num" id="sDisc">−₹0</span></div>
    <div style="display:flex;justify-content:space-between;font-size:15px;font-weight:800;border-top:1px dashed var(--line2);padding-top:8px;margin-top:8px"><span>Total</span><span class="num" id="sTot">₹0</span></div>
    <button class="btn btn--go" style="margin-top:12px" onclick="openCheckout()">Proceed to Checkout →</button>
  </div>
</section>

<!-- ACCOUNT -->
<section id="view-account" class="view">
  <div class="sec">OTP LOGIN</div>
  <div class="glass" style="padding:12px">
    <input id="oPhone" class="fld" placeholder="10-digit mobile number" maxlength="10">
    <button class="btn btn--go" style="margin-top:8px" onclick="sendOTP()">Send OTP</button>
    <input id="oCode" class="fld" placeholder="Enter OTP" maxlength="6" style="display:none">
    <button class="btn btn--pink" id="oVerifyBtn" style="margin-top:8px;display:none" onclick="verifyOTP()">Verify OTP</button>
  </div>
  <div class="sec">JSON LOGIN</div>
  <div class="glass" style="padding:12px">
    <textarea id="jInput" class="fld" rows="3" placeholder='{"user_id":"...","xo":"..."}'></textarea>
    <button class="btn btn--ghost" style="margin-top:8px" onclick="loginJSON()">Connect Session</button>
  </div>
  <div class="sec">SAVED ADDRESSES</div>
  <div id="addrList"></div>
  <button class="btn btn--ghost" style="margin-top:8px" onclick="openAddressForm()">+ Add New Address</button>
  <div class="sec">ORDERS</div>
  <div id="orderList"></div>
</section>

<!-- NAV -->
<nav class="nav">
  <button class="on" onclick="go('home')">HOME</button>
  <button onclick="go('search')">SEARCH</button>
  <button onclick="go('cart')">CART</button>
  <button onclick="go('account')">ACCOUNT</button>
</nav>

<!-- PRODUCT SHEET -->
<div class="sheetwrap" id="sheetWrap" onclick="if(event.target===this)closeSheet()">
  <div class="sheet" id="sheetBody"></div>
</div>

<!-- QR MODAL -->
<div class="qrwrap" id="qrWrap">
  <div class="qrcard">
    <div style="font-size:12px;font-weight:800;color:var(--cyan)">UPI PAYMENT</div>
    <div class="num" id="qrAmt" style="font-size:28px;font-weight:800;margin:6px 0">₹0</div>
    <div style="width:200px;height:200px;margin:10px auto;background:#fff;border-radius:12px;padding:6px" id="qrBox"></div>
    <a id="qrLink" href="#" class="btn btn--ghost" style="display:block;text-decoration:none;margin-top:8px">Open in UPI App</a>
    <button class="btn btn--go" style="margin-top:8px" onclick="confirmPay()">I Have Paid</button>
    <button class="btn btn--ghost" style="margin-top:8px" onclick="document.getElementById('qrWrap').classList.remove('show')">Cancel</button>
  </div>
</div>

<script>
const UID = (window.Telegram?.WebApp?.initDataUnsafe?.user?.id) || localStorage.getItem('device_uid') || '901245';
localStorage.setItem('device_uid', UID);

let S = { cart: [], addresses: [], curProd: null, selectedAddr: null, pendPay: null };
let pullScheduled = null;

async function api(path, opts = {}) {
  const r = await fetch(path, {
    method: opts.method || 'GET',
    headers: { 'Content-Type': 'application/json', 'X-User-Id': UID },
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  return await r.json();
}

function toast(m) {
  const t = document.getElementById('toast');
  t.textContent = m; t.className = 'toast show';
  setTimeout(() => t.className = 'toast', 2000);
}

function go(page) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.nav button').forEach((b, i) => b.classList.toggle('on', ['home','search','cart','account'][i] === page));
  document.getElementById(`view-${page}`).classList.add('active');
  if (page === 'cart') renderCart();
  if (page === 'account') { loadAddresses(); loadOrders(); }
}

async function rollOffer() {
  const d = await api('/api/fod/roll');
  if (d.ok) {
    document.getElementById('fodAmt').textContent = d.offer.display_text;
    toast('Fresh offer secured!');
  }
}

async function doSearch() {
  const q = document.getElementById('q').value || 'trending';
  const d = await api('/api/search', { method: 'POST', body: { query: q } });
  document.getElementById('searchGrid').innerHTML = (d.catalogs || []).map(p => `
    <div class="pcard" onclick="openProduct(${p.product_id})">
      <div class="pcard-img"><img src="${p.image}"></div>
      <div class="pcard-body">
        <div class="pcard-name">${p.name}</div>
        <div class="num" style="font-weight:700;color:var(--cyan)">₹${p.price}</div>
      </div>
    </div>
  `).join('');
}

async function openProduct(id) {
  const p = await api(`/api/product?product_id=${id}`);
  S.curProd = p;
  document.getElementById('sheetBody').innerHTML = `
    <div style="display:flex;gap:12px">
      <img src="${p.image}" style="width:80px;height:80px;border-radius:10px;object-fit:cover">
      <div>
        <div style="font-weight:700;font-size:14px">${p.name}</div>
        <div class="num" style="font-size:20px;font-weight:800;color:var(--cyan);margin-top:4px">₹${p.price}</div>
      </div>
    </div>
    <div class="sec">SELECT SIZE</div>
    <div style="display:flex;gap:8px" id="sizeList">
      ${(p.sizes || []).map((s, i) => `<button class="btn btn--ghost" style="flex:1" onclick="selectSize(this, ${s.id}, '${s.name}')">${s.name}</button>`).join('')}
    </div>
    <div style="display:flex;gap:10px;margin-top:16px">
      <button class="btn btn--ghost" onclick="addToCart(false)">Add to Cart</button>
      <button class="btn btn--go" onclick="addToCart(true)">Buy Now</button>
    </div>
  `;
  document.getElementById('sheetWrap').classList.add('show');
}

function selectSize(btn, vid, name) {
  document.querySelectorAll('#sizeList button').forEach(b => b.classList.remove('btn--go'));
  btn.classList.add('btn--go');
  S.curProd.selectedSize = { id: vid, name };
}

async function addToCart(buyNow) {
  const p = S.curProd;
  const s = p.selectedSize || (p.sizes && p.sizes[0]) || { id: 0, name: 'Free Size' };
  await api('/api/cart/add', {
    method: 'POST',
    body: {
      product_id: p.product_id,
      name: p.name,
      price: p.price,
      mrp: p.mrp,
      image: p.image,
      supplier_id: p.supplier_id,
      variation_id: s.id,
      variation: s.name,
      qty: 1
    }
  });
  toast('Added to cart!');
  closeSheet();
  updateBadge();
  if (buyNow) go('cart');
}

async function renderCart() {
  const d = await api('/api/cart');
  S.cart = d.items || [];
  updateBadge();

  if (!S.cart.length) {
    document.getElementById('cartList').innerHTML = '<div style="text-align:center;padding:30px;color:var(--txt2)">Cart is empty</div>';
    document.getElementById('cartSummary').style.display = 'none';
    return;
  }

  document.getElementById('cartList').innerHTML = S.cart.map((c, i) => `
    <div class="glass citem">
      <img src="${c.image}">
      <div style="flex:1">
        <div style="font-size:13px;font-weight:700">${c.name}</div>
        <div style="font-size:11px;color:var(--txt2)">${c.variation_name}</div>
        <div class="num" style="font-weight:700">₹${c.price}</div>
      </div>
      <div class="cart-actions">
        <button class="btn-del" onclick="deleteCartItem(${i})">✕</button>
        <span class="num">${c.qty}</span>
        <button class="btn-inc" onclick="incCartItem(${i})">+</button>
      </div>
    </div>
  `).join('');

  const sum = await api('/api/checkout/summary');
  document.getElementById('sMrp').textContent = `₹${sum.product_price}`;
  document.getElementById('sDisc').textContent = `−₹${Math.abs(sum.total_discounts)}`;
  document.getElementById('sTot').textContent = `₹${sum.total}`;
  document.getElementById('cartSummary').style.display = 'block';
}

async function incCartItem(i) {
  const c = S.cart[i];
  await api('/api/cart/update', { method: 'POST', body: { cart_id: c.id, product_id: c.product_id, qty: c.qty + 1 } });
  renderCart();
}

async function deleteCartItem(i) {
  const c = S.cart[i];
  // 1. Delete locally & tombstone immediately
  await api('/api/cart/update', { method: 'POST', body: { cart_id: c.id, product_id: c.product_id, qty: 0 } });
  toast('Item removed');
  renderCart();

  // 2. Schedule pull 4 seconds out so lagging Meesho removes don't flip back
  clearTimeout(pullScheduled);
  pullScheduled = setTimeout(async () => {
    await api('/api/cart/sync/pull');
    renderCart();
  }, 4000);
}

function updateBadge() {
  const cnt = S.cart.reduce((a, b) => a + Number(b.qty), 0);
  document.getElementById('cartBadge').textContent = cnt;
}

function closeSheet() {
  document.getElementById('sheetWrap').classList.remove('show');
}

function openAddressSheet() {
  document.getElementById('sheetBody').innerHTML = `
    <div class="sec">SELECT SAVED ADDRESS</div>
    ${S.addresses.map(a => `
      <div class="glass" style="padding:10px;margin-top:6px;cursor:pointer" onclick="selectDeliveryAddr(${a.id}, '${a.address_line_1}')">
        <div style="font-weight:700;font-size:13px">${a.name} (${a.pin})</div>
        <div style="font-size:11px;color:var(--txt2)">${a.address_line_1}</div>
      </div>
    `).join('')}
    <button class="btn btn--go" style="margin-top:10px" onclick="openAddressForm()">+ Add New Address</button>
  `;
  document.getElementById('sheetWrap').classList.add('show');
}

function selectDeliveryAddr(id, line) {
  S.selectedAddr = id;
  document.getElementById('cartAddr').textContent = line;
  closeSheet();
}

function openAddressForm() {
  document.getElementById('sheetBody').innerHTML = `
    <div class="sec">ADD DELIVERY ADDRESS</div>
    <button class="btn btn--ghost" onclick="detectLocation()">📍 Detect Location</button>
    <input id="aName" class="fld" placeholder="Name">
    <input id="aPhone" class="fld" placeholder="Mobile">
    <input id="aLine" class="fld" placeholder="House / Flat / Street">
    <input id="aCity" class="fld" placeholder="City">
    <input id="aPin" class="fld" placeholder="PIN Code">
    <button class="btn btn--go" style="margin-top:10px" onclick="saveAddress()">Save Address</button>
  `;
  document.getElementById('sheetWrap').classList.add('show');
}

async function detectLocation() {
  toast('Detecting...');
  const geo = await api('/api/geocode');
  const loc = geo.results[0];
  document.getElementById('aCity').value = loc.city;
  document.getElementById('aPin').value = loc.pin;
  toast('Location detected!');
}

async function saveAddress() {
  await api('/api/addresses/create', {
    method: 'POST',
    body: {
      name: document.getElementById('aName').value,
      mobile: document.getElementById('aPhone').value,
      address_line_1: document.getElementById('aLine').value,
      city: document.getElementById('aCity').value,
      pin: document.getElementById('aPin').value,
    }
  });
  toast('Address saved!');
  closeSheet();
  loadAddresses();
}

async function loadAddresses() {
  const d = await api('/api/addresses');
  S.addresses = d.addresses || [];
  if (S.addresses.length && !S.selectedAddr) {
    selectDeliveryAddr(S.addresses[0].id, S.addresses[0].address_line_1);
  }
}

function openCheckout() {
  if (!S.selectedAddr) return toast('Select delivery address first');
  document.getElementById('sheetBody').innerHTML = `
    <div class="sec">CHOOSE PAYMENT</div>
    <button class="btn btn--go" style="margin-top:10px" onclick="placeOrder('COD')">Pay Cash on Delivery (COD)</button>
    <button class="btn btn--pink" style="margin-top:10px" onclick="placeOrder('UPI')">Pay Online via UPI (Instant Discount)</button>
  `;
  document.getElementById('sheetWrap').classList.add('show');
}

async function placeOrder(mode) {
  closeSheet();
  toast('Processing order...');
  if (mode === 'COD') {
    const res = await api('/api/order/place_cod', { method: 'POST', body: { address_id: S.selectedAddr } });
    if (res.ok) {
      toast('Order Placed Successfully!');
      renderCart();
      go('account');
    } else {
      toast(res.message || 'Order failed');
    }
  } else {
    const res = await api('/api/order/pay_online', { method: 'POST', body: { address_id: S.selectedAddr } });
    if (res.ok) {
      S.pendPay = res.order_num;
      document.getElementById('qrAmt').textContent = `₹${res.upi_amount}`;
      document.getElementById('qrBox').innerHTML = `<img src="${res.qr_url}" style="width:100%;height:100%">`;
      document.getElementById('qrLink').href = res.upi_intent_url;
      document.getElementById('qrWrap').classList.add('show');
    } else {
      toast(res.message || 'Payment initiation failed');
    }
  }
}

async function confirmPay() {
  await api('/api/order/confirm', { method: 'POST', body: { order_num: S.pendPay } });
  document.getElementById('qrWrap').classList.remove('show');
  toast('Payment Confirmed! Order placed.');
  renderCart();
  go('account');
}

async function sendOTP() {
  const p = document.getElementById('oPhone').value;
  const res = await api('/api/auth/otp_send', { method: 'POST', body: { phone_number: p } });
  if (res.ok) {
    document.getElementById('oCode').style.display = 'block';
    document.getElementById('oVerifyBtn').style.display = 'block';
    toast('OTP sent!');
  }
}

async function verifyOTP() {
  const res = await api('/api/auth/otp_verify', {
    method: 'POST',
    body: { phone_number: document.getElementById('oPhone').value, otp: document.getElementById('oCode').value }
  });
  if (res.ok) {
    toast('Logged in successfully!');
    go('home');
  }
}

async function loginJSON() {
  const raw = document.getElementById('jInput').value;
  try {
    const res = await api('/api/auth/json_login', { method: 'POST', body: JSON.parse(raw) });
    if (res.ok) {
      toast('Session Connected!');
      go('home');
    }
  } catch (e) {
    toast('Invalid JSON');
  }
}

async function loadOrders() {
  const d = await api('/api/orders');
  document.getElementById('orderList').innerHTML = (d.orders || []).map(o => `
    <div class="glass" style="padding:10px;margin-top:6px">
      <div style="display:flex;justify-content:space-between"><b>Order #${o.id}</b><span style="color:var(--cyan)">${o.status}</span></div>
      <div style="font-size:12px;color:var(--txt2);margin-top:2px">₹${o.total} • ${o.payment_method}</div>
    </div>
  `).join('') || '<div style="color:var(--txt2);font-size:12px">No orders yet</div>';
}

// Initial bootstrap
(async () => {
  rollOffer();
  const d = await api('/api/search', { method: 'POST', body: { query: 'fashion trending' } });
  document.getElementById('homeGrid').innerHTML = (d.catalogs || []).slice(0, 4).map(p => `
    <div class="pcard" onclick="openProduct(${p.product_id})">
      <div class="pcard-img"><img src="${p.image}"></div>
      <div class="pcard-body">
        <div class="pcard-name">${p.name}</div>
        <div class="num" style="font-weight:700;color:var(--cyan)">₹${p.price}</div>
      </div>
    </div>
  `).join('');
  loadAddresses();
  api('/api/cart').then(d => { S.cart = d.items || []; updateBadge(); });
})();
</script>
</body>
</html>
